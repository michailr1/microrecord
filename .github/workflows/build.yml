name: Build MicroRecord

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0); leave empty for a plain build'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to publish the GitHub Release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          # Tag v1.2.3 (pushed, or given to a manual run) -> 1.2.3; other builds use the version from the csproj.
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.release_tag }}" }
          if ($tag) { $v = $tag.TrimStart('v') }
          else { $v = ([xml](Get-Content MicroRecord.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Restore
        run: dotnet restore MicroRecord.csproj

      # Full build: .NET runtime bundled and compressed into the EXE. Runs anywhere.
      - name: Publish self-contained EXE
        run: dotnet publish MicroRecord.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o publish/full

      # Small build: needs the .NET 9 Desktop Runtime installed (Windows offers the download if it is missing).
      - name: Publish framework-dependent EXE
        run: dotnet publish MicroRecord.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o publish/small

      - name: Collect release files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Unversioned names keep https://github.com/<repo>/releases/latest/download/<name> stable (install.ps1 relies on it).
          Copy-Item publish/full/MicroRecord.exe dist/MicroRecord-win-x64.exe
          Copy-Item publish/small/MicroRecord.exe dist/MicroRecord-win-x64-net9.exe

      # Code signing via SignPath Foundation (see CODE_SIGNING.md). Runs for releases only, and only once
      # the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are configured;
      # until then releases are published unsigned.
      - name: Upload unsigned EXEs for signing
        id: upload-unsigned
        if: steps.version.outputs.tag != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.version.outputs.tag != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'microrecord' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing requests are approved by hand in SignPath; leave time for that.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use signed EXEs
        if: steps.version.outputs.tag != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed/*.exe dist/ -Force
          Get-AuthenticodeSignature dist/*.exe | Format-Table Path, Status, @{ n = 'Signer'; e = { $_.SignerCertificate.Subject } } -AutoSize
          if (Get-AuthenticodeSignature dist/*.exe | Where-Object Status -ne 'Valid') { throw 'A signed EXE has no valid signature.' }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object { "{0,-40} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroRecord-${{ steps.version.outputs.version }}-win-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notes = @"
          ## Скачать

          | Файл | Размер | Когда выбирать |
          |---|---|---|
          | **MicroRecord-win-x64.exe** | ~50 МБ | Работает сразу на любом Windows 10 2004+ / 11 x64. Ничего ставить не нужно. |
          | **MicroRecord-win-x64-net9.exe** | ~2 МБ | Если установлен [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0). Если нет — Windows предложит его скачать. |

          **Проще всего** — установка одной командой в PowerShell (без прав администратора и без окна SmartScreen):
          ``````
          irm https://raw.githubusercontent.com/michailr1/microrecord/main/install.ps1 | iex
          ``````

          Или скачайте EXE ниже, положите в любую папку и запустите. Запись: **Ctrl+Alt+R**. Контрольные суммы — в SHA256SUMS.txt.

          **«Система Windows защитила ваш компьютер»** — нажмите «Подробнее» → «Выполнить в любом случае». Если Windows просит пароль администратора: до запуска откройте свойства EXE и отметьте «Разблокировать» (или `Unblock-File` в PowerShell).
          "@
          $notes += if ((Get-AuthenticodeSignature dist/MicroRecord-win-x64.exe).Status -eq 'Valid') {
            "`n`nФайлы подписаны: free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Политика подписи](https://github.com/michailr1/microrecord/blob/main/CODE_SIGNING.md)."
          } else {
            "`n`nЭта версия без цифровой подписи."
          }
          # --target creates the tag on this commit when it does not exist yet (manual runs).
          gh release create "${{ steps.version.outputs.tag }}" dist/* --target "${{ github.sha }}" --title "MicroRecord $v" --notes "$notes" --generate-notes
